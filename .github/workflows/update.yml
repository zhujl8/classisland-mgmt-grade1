name: 更新高一课程表

# 定时：每天 06:30（北京时间）自动跑一次，即 UTC 22:30
# 手动：仓库 Actions 页 → 「更新高一课程表」→ Run workflow
on:
  schedule:
    - cron: "30 22 * * *"   # GitHub cron 用 UTC：22:30 UTC = 次日 06:30 北京时间
  workflow_dispatch:
    inputs:
      source_file:
        description: 源数据文件名（源站 API 的 file 参数）
        required: false
        default: result_actual.json
      force_bump:
        description: 内容未变化时也递增版本号（强制客户端刷新）
        type: boolean
        required: false
        default: false

# 只想每周跑一次就把 cron 改成 "30 22 * * 0"（每周一 06:30 北京时间）；
# 想换时间就按 UTC 换算，例如每天 06:00 北京时间 → "0 22 * * *"。

permissions:
  contents: write

concurrency:
  group: update-schedule
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      SOURCE_FILE: ${{ inputs.source_file || 'result_actual.json' }}
      FORCE_BUMP: ${{ inputs.force_bump == true && '--force-bump' || '' }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          # 需要完整历史，后面 reset 到 origin/main 才有依据
          fetch-depth: 0

      # 定时任务是按「触发那一刻的 main」检出的，跑的过程中可能有人推了新提交；
      # 先同步一次，保证用的是最新版 build.py（否则会按旧规则生成、把新结构覆盖回去）。
      - name: 同步最新 main
        run: |
          git fetch origin main
          git reset --hard origin/main
          echo "当前代码：$(git log --oneline -1)"

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 拉取源数据并生成集控档案
        run: |
          python scripts/build.py --source-file "$SOURCE_FILE" $FORCE_BUMP

      - name: 校验生成的档案
        run: python scripts/validate.py

      - name: 写入运行摘要
        if: always()
        run: |
          if [ -f data/last-update.md ]; then
            cat data/last-update.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "未生成更新摘要" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 上传更新摘要工件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-summary
          path: |
            data/last-update.md
            data/last-update.json
          if-no-files-found: ignore

      # 推送可能被别人（或上一次运行）抢先；那就丢掉本次提交、同步到最新 main、
      # 用最新代码重建一遍再推，最多重试 3 次。
      - name: 提交并推送
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          commit_and_push() {
            git add -A
            if git diff --cached --quiet; then
              echo "课表无变化，跳过提交"
              return 0
            fi
            git commit -m "chore: 更新高一课程表档案（$(date -u +'%Y-%m-%d %H:%M UTC')）"
            git push origin HEAD:main
          }

          if commit_and_push; then
            exit 0
          fi

          for attempt in 1 2 3; do
            echo "::warning::推送被拒（远程有新提交），第 $attempt 次重试：同步 main 后重建"
            git reset --hard HEAD~1
            git fetch origin main
            git reset --hard origin/main
            python scripts/build.py --source-file "$SOURCE_FILE" $FORCE_BUMP
            python scripts/validate.py
            if commit_and_push; then
              exit 0
            fi
          done

          echo "::error::连续 3 次推送失败，请检查仓库权限或手动运行"
          exit 1
